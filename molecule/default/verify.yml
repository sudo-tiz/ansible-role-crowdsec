---
- name: Verify CrowdSec and its seeded Traefik bouncer
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Verify CrowdSec registered the bouncer and installed its key
      block:
        - name: Wait for the Traefik bouncer to register
          ansible.builtin.command:
            cmd: docker exec crowdsec cscli bouncers list
          register: crowdsec_molecule_bouncers
          until: "'traefik' in crowdsec_molecule_bouncers.stdout"
          retries: 60
          delay: 5
          changed_when: false

        - name: Read the Traefik bouncer key file
          ansible.builtin.slurp:
            src: "{{ crowdsec_traefik_bouncer_key_file_path }}"
          register: crowdsec_molecule_key_file

        - name: Assert CrowdSec registered the bouncer and installed its key
          ansible.builtin.assert:
            that:
              - "'traefik' in crowdsec_molecule_bouncers.stdout"
              - (crowdsec_molecule_key_file.content | b64decode | trim) == crowdsec_bouncer_key
            success_msg: "CrowdSec started, registered the Traefik bouncer, and installed its key"
            fail_msg: "CrowdSec did not register the Traefik bouncer correctly"

      rescue:
        - name: Retrieve CrowdSec service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=crowdsec.service
          register: crowdsec_molecule_service_log
          changed_when: false

        - name: Show CrowdSec service log
          ansible.builtin.debug:
            var: crowdsec_molecule_service_log.stdout_lines

        - name: Fail verification
          ansible.builtin.fail:
            msg: "CrowdSec failed to register the Traefik bouncer."
