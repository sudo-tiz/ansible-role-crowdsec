---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: crowdsec-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /var/lib/containerd
    keep_volumes: false
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        crowdsec_collections_custom: [crowdsecurity/linux]
        crowdsec_acquisitions_custom:
          - source: file
            filenames: [/etc/crowdsec/acquis.d/molecule.log]
            labels: {type: syslog}
        crowdsec_traefik_bouncer_enabled: true
        crowdsec_bouncer_key: molecule-test-bouncer-key
        crowdsec_traefik_bouncer_key_file_path: /crowdsec/traefik-bouncer-key
        crowdsec_molecule_log_host_path: /crowdsec/config/acquis.d/molecule.log
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
